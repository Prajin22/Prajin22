<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
    <title>Job Seeker Sign Up</title>
</head>
<body>
    <!-- Custom cursor -->
    <div class="custom-cursor"></div>
    
    <!-- Floating animation elements -->
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <div class="container">
        <h1 class="animated-title">Job Seeker Sign Up</h1>
        <form method="POST" action="/jobseeker-signup">
            <input type="text" name="firstName" placeholder="Firstname" required>
            <input type="text" name="lastName" placeholder="Lastname" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="phone" placeholder="Phone" required>
            <select name="gender" required title="Gender">
                <option value="" disabled selected>Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <input type="number" name="age" placeholder="Age" min="18" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirmPassword" placeholder="Confirm Password" required>
            <button type="submit" class="animated-submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{{ url_for('job_seeker_login') }}">Login</a></p>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="{{ url_for('static', filename='signup.js') }}"></script>
</body>
</html>
