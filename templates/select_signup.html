<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='role_select.css') }}">
    <title>Choose Role</title>
</head>
<body>
    <div class="role-select-container">
        <h1 class="animated-title role-select-title">Welcome to Zeus Jobs</h1>
        <p class="role-select-desc">Please select your role to continue</p>
        <div class="role-card">
            <div class="role-option">
                <div class="role-icon">👤</div>
                <div class="role-title">Job Seeker</div>
                <div class="role-desc">Find your dream job, connect with recruiters, and grow your career.</div>
                <a class="role-button" href="{{ url_for('job_seeker_login') }}">Login</a>
                <a class="role-button" href="{{ url_for('job_seeker_signup') }}">Sign Up</a>
            </div>
            <div class="role-option">
                <div class="role-icon">🏢</div>
                <div class="role-title">Recruiter</div>
                <div class="role-desc">Post jobs, discover top talent, and manage your company's hiring.</div>
                <a class="role-button" href="{{ url_for('recruiter_login') }}">Login</a>
                <a class="role-button" href="{{ url_for('recruiter_signup') }}">Sign Up</a>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        gsap.from(".animated-title", {
            duration: 1.2,
            y: -50,
            opacity: 0,
            ease: "bounce.out"
        });
        gsap.from(".role-card", {
            duration: 1,
            y: 40,
            opacity: 0,
            delay: 0.3,
            ease: "power2.out"
        });
        gsap.from(".role-option", {
            duration: 1,
            scale: 0.8,
            opacity: 0,
            stagger: 0.2,
            delay: 0.5,
            ease: "elastic.out(1, 0.4)"
        });
    </script>
</body>
</html>
